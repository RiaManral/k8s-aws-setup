---
- name: Install k3s on master
  hosts: role_master
  become: true
  tasks:
    - name: Download and install k3s
      shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for node-token to exist
      wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 120

    - name: Fetch the node token
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token_raw

    - name: Set token as a fact for later use
      set_fact:
        k3s_token: "{{ node_token_raw.content | b64decode | trim }}"

    - name: Show master private IP
      debug:
        msg: "Master IP: {{ ansible_default_ipv4.address | default(ansible_host) }}"